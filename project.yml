name: Tether

# Signing + bundle id prefix live in Config/Local.xcconfig so you only edit one file.
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig

options:
  bundleIdPrefix: com.example
  # Marks the project as checked by this Xcode, so it stops suggesting "recommended settings".
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  # ---------------------------------------------------------------- iPhone
  Tether:
    type: application
    platform: iOS
    sources:
      - path: Tether
      - path: Shared
    dependencies:
      - target: TetherWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).tether
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: DiTether
        CODE_SIGN_ENTITLEMENTS: Tether/Tether.entitlements
    info:
      path: Tether/Info.plist
      properties:
        CFBundleDisplayName: DiTether
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: DiTether shares your iPhone's position with your Apple Watch, so the watch can tell how far you walked away from your iPhone. It is also used when you add a safe place. Locations never leave your devices.
        NSLocationAlwaysAndWhenInUseUsageDescription: Choose Always so your watch can keep measuring how far you are from your iPhone while it is locked in a bag or on a table. Locations never leave your devices.
        NSHealthShareUsageDescription: DiTether uses Workout access only to open DiTether on your Apple Watch from this iPhone. Nothing is read or saved to Health.
        NSHealthUpdateUsageDescription: DiTether uses Workout access only to open DiTether on your Apple Watch from this iPhone. Nothing is read or saved to Health.
        NSBluetoothAlwaysUsageDescription: Your Apple Watch connects to this iPhone over Bluetooth to feel how close it is, so it can warn you the moment you walk away from it. DiTether also connects to your DiTAG to tell you when your keys or bag are left behind.
        NSCameraUsageDescription: DiTether's camera lets you take photos with a press on your DiTAG, like a remote shutter.
        NSPhotoLibraryAddUsageDescription: DiTether saves the photos you take with its camera to your library.
        UIBackgroundModes:
          - location
          - bluetooth-peripheral
          - bluetooth-central
          - audio

    entitlements:
      path: Tether/Tether.entitlements
      properties:
        com.apple.developer.healthkit: true

  # ----------------------------------------------------------- Apple Watch
  TetherWatch:
    type: application
    platform: watchOS
    sources:
      - path: TetherWatch
      - path: Shared
    dependencies:
      - target: TetherWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).tether.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: TetherWatch/TetherWatch.entitlements
    info:
      path: TetherWatch/Info.plist
      properties:
        CFBundleDisplayName: DiTether
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_PREFIX).tether
        WKRunsIndependentlyOfCompanionApp: false
        DiTetherAppGroup: group.$(BUNDLE_PREFIX).tether
        WKBackgroundModes:
          - workout-processing
        # Core Location checks UIBackgroundModes (not WKBackgroundModes) before allowing background
        # updates, and crashes the app if "location" is missing here.
        UIBackgroundModes:
          - location
        NSHealthShareUsageDescription: DiTether starts a background session so your watch can keep checking that your iPhone is nearby. Nothing is read or saved to Health.
        NSHealthUpdateUsageDescription: DiTether starts a background session so your watch can keep checking that your iPhone is nearby. Nothing is read or saved to Health.
        NSBluetoothAlwaysUsageDescription: DiTether connects to your iPhone over Bluetooth to feel how close it is, so it can warn you the moment you walk away from it.
        NSLocationWhenInUseUsageDescription: DiTether remembers where your iPhone went out of range and measures how far you walk from that spot, so it can alert you sooner and help you find the phone later. Locations never leave your devices.
    entitlements:
      path: TetherWatch/TetherWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX).tether

  # ------------------------------------------------- Watch face complication
  TetherWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: TetherWatchWidgets
      - path: Shared/WidgetState.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).tether.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_ENTITLEMENTS: TetherWatchWidgets/TetherWatchWidgets.entitlements
        SKIP_INSTALL: YES
    info:
      path: TetherWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: DiTether
        DiTetherAppGroup: group.$(BUNDLE_PREFIX).tether
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TetherWatchWidgets/TetherWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX).tether

schemes:
  Tether:
    build:
      targets:
        Tether: all
    run:
      config: Debug
    archive:
      config: Release
  TetherWatch:
    build:
      targets:
        TetherWatch: all
    run:
      config: Debug
    archive:
      config: Release
